document.getElementById('show').addEventListener('change',e=>input.type=e.target.checked?'text':'password');
async function openVault(key){
 const raw=localStorage.getItem(VAULT_KEY);if(raw===null)return {};
 async function read(candidate){const v=JSON.parse(raw),clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(v.iv),additionalData:VAULT_AAD},candidate,from64(v.data)),obj=JSON.parse(dec.decode(clear));if(!obj||Array.isArray(obj)||typeof obj!=='object'||Object.values(obj).some(v=>typeof v!=='string'))throw Error('format');return obj}
 try{return await read(key)}catch{}
 if(payload.legacyKeys){try{const wrapped=payload.legacyKeys,clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(wrapped.iv),additionalData:enc.encode('private-workspace:v1:legacy-vault-keys')},key,from64(wrapped.data));for(const encoded of JSON.parse(dec.decode(clear))){try{return await read(await crypto.subtle.importKey('raw',from64(encoded),{name:'AES-GCM'},false,['decrypt']))}catch{}}}catch{}}
 throw Error('本机加密记录未能读取，已停止打开以保留原记录。请先备份浏览器资料。');
}
function installStorage(key,initial){
 const data=new Map(Object.entries(initial));let revision=0,completed=0,tail=Promise.resolve(),failure='',externalChange=false;
 function status(){const el=document.getElementById('portal-save');if(el)el.textContent=externalChange?'其他页面有修改，请导出后刷新':failure?'保存失败，请导出备份':completed<revision?'加密保存中…':'本机记录已加密';}
 function save(){
  if(externalChange)throw Error('其他页面已修改记录');
  const current=++revision,text=JSON.stringify(Object.fromEntries(data));status();
  tail=tail.catch(()=>{}).then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));try{const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:VAULT_AAD},key,enc.encode(text));localStorage.setItem(VAULT_KEY,JSON.stringify({v:1,iv:to64(iv),data:to64(cipher)}));completed=current;failure='';}catch{failure='save';}status()});
 }
 window.PortalStorage=Object.freeze({getItem:k=>data.get(String(k))??null,setItem:(k,v)=>{data.set(String(k),String(v));save()},removeItem:k=>{data.delete(String(k));save()},clear:()=>{data.clear();save()},key:i=>[...data.keys()][i]??null,get length(){return data.size}});
 window.PortalLock=async()=>{await tail;if(failure){alert('本机加密保存失败，请先使用完整导出保存修改。');return;}location.reload()};
 window.addEventListener('beforeunload',e=>{if(completed<revision||failure){e.preventDefault();e.returnValue=''}});
 window.addEventListener('storage',e=>{if(e.key===VAULT_KEY){externalChange=true;status();window.dispatchEvent(new StorageEvent('storage',{key:'portal-conflict'}));}});
 window.addEventListener('portal-ready',()=>{document.getElementById('portal-lock').addEventListener('click',window.PortalLock);status()},{once:true});
}
document.getElementById('unlock').addEventListener('submit',async event=>{
 event.preventDefault();if(!crypto?.subtle||!window.DecompressionStream){message.textContent='请通过 HTTPS，使用新版 Safari、Chrome 或 Edge 打开。';return;}
 button.disabled=true;button.textContent='正在解锁…';message.textContent='';
 let key,compressed;
 try{const material=await crypto.subtle.importKey('raw',enc.encode(input.value.trim()),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv),additionalData:PAGE_AAD},key,from64(payload.data));}
 catch{message.textContent='密码不正确，或页面文件已损坏。';button.disabled=false;button.textContent='解锁';return;}
 try{const saved=await openVault(key);const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();window.PortalInit=()=>{installStorage(key,saved);delete window.PortalInit;};input.value='';document.open();document.write(html);document.close();}
 catch(e){message.textContent=e.message||'未能打开，请刷新后重试。';button.disabled=false;button.textContent='解锁';}
});
})();
</script></body></html>
